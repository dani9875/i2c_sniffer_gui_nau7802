name: Build WeighSniffer Linux

permissions:
  contents: write

on:
  push:
    tags:
      - '*'       # trigger on any tag push
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        config: [Release]

    steps:
      # --- Checkout code ---
      - uses: actions/checkout@v4

      # --- Install Qt and build tools ---
      - name: Install Qt and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev

      # --- Configure CMake ---
      - name: Configure CMake
        run: |
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      # --- Build ---
      - name: Build
        run: |
          cmake --build build --config ${{ matrix.config }}

      # --- Package artifact (tar.gz outside build folder) ---
      - name: Create release tar.gz
        run: |
          tar -czf WeighSniffer-Linux.tar.gz -C build .

      # --- Upload artifact ---
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeighSniffer-Linux
          path: WeighSniffer-Linux.tar.gz

      # --- Create GitHub Release for tags only ---
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: WeighSniffer-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}